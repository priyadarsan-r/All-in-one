name: Daily production
on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt pytest
      - run: |
          python -m src.cli discover
          python -m src.cli generate --count 3
          python -m src.cli produce --count 3
          pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: curiodaily-videos-${{ github.run_number }}
          path: output/*
          retention-days: 5
      - name: Save JSON state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Save production state"
          git push
