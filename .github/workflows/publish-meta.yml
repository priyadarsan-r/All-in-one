name: Publish Instagram or Facebook Reels
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [instagram, facebook]
        required: true
      dry_run:
        required: true
        default: "true"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: curiodaily-videos-*
          merge-multiple: true
          path: output
      - run: python -m src.cli publish --platform "${{ inputs.platform }}" --limit 3
        env:
          ENABLE_PUBLISHING: "true"
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLIC_VIDEO_URL: ${{ secrets.PUBLIC_VIDEO_URL }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
