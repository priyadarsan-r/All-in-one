[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "curiodaily-media-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["feedparser==6.0.11","requests==2.32.3","Pillow==11.1.0","python-dotenv==1.0.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
